[binaries]
c = 'or1k-appotech-elf-gcc'
ar = 'or1k-appotech-elf-ar'
as = 'or1k-appotech-elf-as'
ld = 'or1k-appotech-elf-ld'
strip = 'or1k-appotech-elf-strip'

[host_machine]
system = 'none'
cpu_family = 'or1k'
cpu = 'jt5295'
endian = 'little'

[built-in options]
c_args = ['-mappotech', '-fno-delayed-branch', '-fno-pic', '-ffunction-sections', '-fdata-sections']
c_link_args = ['-mappotech', '-nostdlib']

[properties]
needs_exe_wrapper = true
